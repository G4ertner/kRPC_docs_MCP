[project]
name = "geept-mcp"
version = "0.1.0"
description = "Scraper and dataset builder for kRPC Python docs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "mcp[cli]>=1.23.1",
  "anyio>=4.12.0",
  "starlette>=0.50.0",
  "requests>=2.32.5",
  "requests-cache>=1.2.1",
  "psutil>=6.1.1",
]

[project.scripts]
krpc-mcp = "mcp_server.main:main"

[project.optional-dependencies]
scrape = [
  "requests>=2.32.5",
  "beautifulsoup4>=4.14.3",
  "lxml>=5.3.0",
  "sphobjinv>=2.3.1",
  "tqdm>=4.66.5",
  "requests-cache>=1.2.1",
]
krpc = [
  "krpc>=0.5.4",
]
enrich = [
  "openai>=2.9.0",
  "tenacity>=8.2.3",
]
snippets = [
  "pyarrow>=22.0.0",
]
viz = [
  "pillow>=12.0.0",
]
dev = [
  "pytest>=9.0.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = [
  "krpc_index",
  "krpc_index.*",
  "mcp_server",
  "mcp_server.*",
], exclude = [
  "data",
  "data.*",
  "scripts",
  "scripts.*",
  "tests",
  "tests.*",
] } }
